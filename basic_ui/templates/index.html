{% from "_macros.html" import message, system_message, composer, drawer %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="htmx-config" content='{"defaultTimeout": 0, "includeIndicatorCSS": false}'>
  <title>{{ agent_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="agent-name">{{ agent_name }}</span>
    <button class="hamburger" id="drawer-toggle" type="button"
            aria-label="Settings" aria-expanded="false" aria-controls="drawer">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </header>

  <aside class="drawer" id="drawer" aria-label="Settings">
    {{ drawer(controls) }}
  </aside>

  <main class="conversation" id="conversation">
    <div class="messages" id="messages">
      {{ system_message(notice) }}
      {% for m in history %}{{ message(m) }}{% endfor %}
    </div>
  </main>

  <footer class="composer-area">
    {{ composer() }}
  </footer>
</body>
</html>
