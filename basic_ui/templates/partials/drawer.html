{% from "_macros.html" import drawer, system_message %}
<template data-target="#drawer-controls" data-swap="replace">
  {{ drawer(controls) }}
</template>
{% if notice %}
<template data-target="#messages" data-swap="append">
  {{ system_message(notice) }}
</template>
{% endif %}
{% if error %}
<template data-target="#messages" data-swap="append">
  {{ system_message(error, kind="error") }}
</template>
{% endif %}
