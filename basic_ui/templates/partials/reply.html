{% from "_macros.html" import message, composer %}
<template data-target="#pending-reply" data-swap="replace">
  {{ message(assistant) }}
  {% if update_due %}
  <div class="message message-system message-working" id="pending-memory"
       data-post="/memory" data-post-on="arrive">
    Updating memory…
  </div>
  {% endif %}
</template>
<template data-target="#pending-user" data-swap="replace">
  {{ message(user) }}
</template>
{% if not update_due %}
<template data-target="#composer" data-swap="replace">
  {{ composer() }}
</template>
{% endif %}
