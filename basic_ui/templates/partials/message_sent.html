{% from "_macros.html" import composer %}
<template data-target="#messages" data-swap="append">
  <div class="message message-user" id="pending-user">
    <span class="message-seq">#…</span>
    <div class="message-content">{{ text }}</div>
  </div>
  <div class="message message-system message-working" id="pending-reply"
       data-post="/reply" data-post-on="arrive">
    <input type="hidden" name="message" value="{{ text }}">
    <span class="pending-text">Thinking…</span>
  </div>
</template>
<template data-target="#composer" data-swap="replace">
  {{ composer(busy=True) }}
</template>
