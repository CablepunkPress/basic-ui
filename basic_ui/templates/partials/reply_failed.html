{% from "_macros.html" import system_message, composer %}
<template data-target="#pending-reply" data-swap="replace">
  {{ system_message(error, kind="error") }}
</template>
<template data-target="#pending-user" data-swap="replace">
  <div class="message message-user message-unsent">
    <span class="message-seq">Not sent</span>
    <div class="message-content">{{ text }}</div>
  </div>
</template>
<template data-target="#composer" data-swap="replace">
  {{ composer(text=text) }}
</template>
